[workspace]
members = [
    "activity",
    "activity-macros", 
    "activity-sys", 
    "activity-build", 
    "examples/auth", 
    "examples/webpack", 
    "examples/snake"
]
resolver = "2"

[workspace.package]
version = "0.10.0"
edition = "2021"
license = "MIT"
repository = "https://github.com/merlinfuchs/activities-rs"
readme = "README.md"

[workspace.dependencies]
activity = { path = "activity", version = "0.10.0" }
activity-sys = { path = "activity-sys", version = "0.10.0" }
activity-macros = { path = "activity-macros", version = "0.10.0" }
js-sys = "0.3.69"
wasm-bindgen = "0.2.92"
wasm-bindgen-futures = "0.4.42"
wasm-bindgen-macro-support = "0.2.92"
serde-wasm-bindgen = "0.4"
serde = { version = "1.0", features = ["derive"] }

[profile.release]
opt-level = "z"
codegen-units = 1
lto = true

[profile.release.package."*"]
codegen-units = 1
opt-level = "z"
